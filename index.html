<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d16"><title>PROJECT ARCADE</title><style>
:root{color-scheme:dark;--bg:#090d16;--panel:#121a29;--panel2:#182337;--edge:#29364d;--muted:#93a2bb;--ink:#edf3ff;--accent:#8b8cfb;--accent2:#b8b7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% -10%,#20294f 0,transparent 33%),var(--bg);color:var(--ink);font-family:Inter,Pretendard,system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{padding:27px 17px;border-right:1px solid var(--edge);background:#0d1421;display:flex;flex-direction:column;gap:32px}.brand{display:flex;gap:12px;align-items:center;padding:0 9px}.brand-logo{display:grid;place-items:center;background:linear-gradient(135deg,#9697ff,#6665d5);width:38px;height:38px;border-radius:13px;font-size:21px}.brand strong{font-size:15px;letter-spacing:.07em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.nav{display:grid;gap:6px}.nav button{width:100%;border:0;border-radius:11px;padding:13px;text-align:left;color:#aebbd0;background:transparent}.nav button.active,.nav button:hover{background:#222a45;color:white}.nav button span{margin-right:12px}.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;line-height:1.8}.main{padding:38px clamp(18px,4.5vw,72px);min-width:0;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent2);font-weight:800}.top h1{margin:5px 0 0;font-size:clamp(25px,3vw,36px);letter-spacing:-.04em}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--edge);padding:11px 16px;border-radius:10px;color:var(--ink);background:var(--panel2);font-weight:650}.btn:hover{border-color:#777bc1}.btn.primary{background:var(--accent);color:#090b1a;border-color:transparent}.btn.primary:hover{background:#a9a8ff}.btn.ghost{background:transparent}.btn.danger{color:#ff999f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:27px}.stat{padding:20px;border:1px solid var(--edge);border-radius:15px;background:linear-gradient(135deg,#182137,#101827)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:7px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:25px 0 14px}.section-head h2{margin:0;font-size:19px}.search{border:1px solid var(--edge);background:#141e30;border-radius:10px;color:white;padding:12px 14px;width:min(100%,340px);outline:0}.search:focus,input:focus,textarea:focus,select:focus{border-color:var(--accent)!important;outline:2px solid #8084fa33}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:17px}.game{border:1px solid var(--edge);border-radius:16px;background:#111928;overflow:hidden;min-width:0;transition:transform .15s,border .15s}.game:hover{transform:translateY(-3px);border-color:#626da1}.cover{height:156px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--ca,#352a58),#111d38);position:relative;overflow:hidden}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover-symbol{font-size:64px;filter:drop-shadow(0 5px 18px #0006)}.cover .chip{position:absolute;left:12px;top:12px;background:#090d19c9;backdrop-filter:blur(10px);border:1px solid #ffffff28;padding:5px 9px;border-radius:7px;font-size:11px}.game-body{padding:17px}.game-body h3{margin:0;font-size:17px}.meta{font-size:12px;color:var(--muted);margin:7px 0 12px}.desc{color:#b9c5d7;font-size:13px;line-height:1.6;min-height:42px;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.game-actions{display:flex;gap:7px}.game-actions .btn{font-size:12px;padding:10px 12px}.game-actions .primary{flex:1}.empty{border:1px dashed #42506a;border-radius:16px;padding:50px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font-size:18px;margin:10px}.recent{display:grid;gap:9px}.recent-item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 17px;border:1px solid var(--edge);background:var(--panel);border-radius:12px}.recent-item strong{font-size:14px}.recent-item small{display:block;margin-top:5px;color:var(--muted)}.muted{color:var(--muted)}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#030612c9;backdrop-filter:blur(9px);z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(100%,550px);max-height:min(90vh,850px);overflow:auto;background:#131c2c;border:1px solid #3b4c69;border-radius:18px;box-shadow:0 24px 90px #0009;padding:25px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:21px}.modal-head h2{margin:0;font-size:22px}.x{border:0;color:#c1c9df;background:transparent;font-size:25px}.field{display:grid;gap:7px;margin:0 0 15px}.field label{font-size:12px;color:#b9c5dd;font-weight:700}.field input,.field textarea,.field select{background:#0b1423;border:1px solid #35445f;border-radius:9px;color:var(--ink);padding:12px;width:100%;outline:0}.field textarea{min-height:88px;resize:vertical}.field small{color:var(--muted);font-size:11px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.detail-art{height:190px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:65px;background:linear-gradient(120deg,#343063,#172240);margin-bottom:17px}.detail-art img{width:100%;height:100%;object-fit:cover}.detail-info{font-size:14px;color:#bac7da;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.detail-tags{display:flex;gap:7px;margin:10px 0}.tag{background:#24314a;color:#cdd8ec;padding:6px 9px;border-radius:7px;font-size:12px}.settings-box{padding:22px;border:1px solid var(--edge);border-radius:14px;background:var(--panel);margin-bottom:15px}.settings-box h3{margin:0 0 9px}.settings-box p{color:var(--muted);font-size:13px;line-height:1.7}.toast{position:fixed;bottom:25px;right:25px;background:#293c57;border:1px solid #6c7998;padding:14px 20px;border-radius:12px;z-index:20;font-size:13px;box-shadow:0 9px 40px #0007}.mobile-nav{display:none}@media(max-width:760px){.app{display:block;padding-bottom:68px}.side{display:none}.main{padding:22px 17px}.top{align-items:flex-start}.top h1{font-size:28px}.top-actions .btn{padding:10px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:21px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:120px}.game-body{padding:12px}.game-body h3{font-size:15px}.game-actions{flex-wrap:wrap}.game-actions .btn{padding:9px;font-size:11px}.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#111a2bf0;backdrop-filter:blur(12px);border-top:1px solid var(--edge);z-index:5}.mobile-nav button{border:0;color:#b7c4d9;background:transparent;padding:11px 2px;font-size:11px}.mobile-nav button.active{color:#b5afff}.mobile-nav span{display:block;font-size:20px;margin-bottom:3px}.recent-item{align-items:flex-start}.modal{padding:19px}}@media(max-width:370px){.cards{grid-template-columns:1fr}.top{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}

.top-actions{flex-wrap:wrap}.statusline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.status-dot{height:8px;width:8px;border-radius:50%;background:#a5b4fc;display:inline-block}.publish-banner{background:linear-gradient(120deg,#232945,#111c2d);border:1px solid #454d76;border-radius:14px;padding:17px 20px;margin-bottom:23px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.publish-banner strong{display:block;margin-bottom:5px}.publish-banner small{color:#adb9d1;line-height:1.6}.pill{font-size:11px;color:#c8d1ef;background:#28324f;border-radius:999px;padding:5px 8px}.pill.live{background:#173c37;color:#83ecd2}.btn:disabled{opacity:.45;cursor:not-allowed}.admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.admin-actions .btn{font-size:12px;padding:8px 10px}.tip{font-size:12px;color:#aab8d0;line-height:1.7}.page-foot{margin-top:28px;color:#73849e;font-size:12px}.meta{overflow-wrap:anywhere}@media(max-width:760px){.publish-banner{align-items:flex-start}.top-actions{width:100%}.top-actions .btn{flex:1}.cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="brand-logo">✦</div><div><strong>PROJECT ARCADE</strong><small>ALL YOUR WORLDS IN ONE PLACE</small></div></div><nav id="sideNav" class="nav"></nav><div class="side-foot">ALL YOUR WORLDS, ONE PLACE.<br>PROJECT ARCADE v0.2</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow"></div><h1 id="pageTitle">게임 라이브러리</h1></div><div class="top-actions"><button class="btn primary" id="addBtn">＋ 게임 등록</button><button class="btn primary" id="launchBtn">🚀 런치</button></div></header><div id="content"></div></main></div><nav id="mobileNav" class="mobile-nav"></nav><div id="modalRoot"></div><div id="toastRoot"></div><input type="file" id="importFile" accept="application/json,.json" hidden><script>
(()=>{'use strict';const ADMIN=false;const DEFAULT_GAMES=[{"id": "janjondosi", "title": "잔존도시", "genre": "생존 · 아포칼립스", "version": "웹게임", "description": "황폐해진 도시에서 자원을 모으고 은신처를 구축하며 살아남는 생존 게임.", "emoji": "🏚️", "color": "#425364", "url": "https://sdrn2149.github.io/janjondosi/", "cover": ""}, {"id": "alien-fisher", "title": "외계어부", "genre": "SF · 낚시 · 탐험", "version": "웹게임", "description": "여러 행성의 바다에서 신비한 외계 생명체를 낚고 새로운 생태계를 연구하세요.", "emoji": "🪐", "color": "#443c83", "url": "https://sdrn2149.github.io/alien_fisher/", "cover": ""}, {"id": "latte-village", "title": "라떼마을", "genre": "농장 · 생활 시뮬레이션", "version": "웹게임", "description": "마을에서 농사를 짓고 작은 일상을 가꾸는 아기자기한 생활 게임.", "emoji": "🌱", "color": "#356554", "url": "https://sdrn2149.github.io/latte-village/", "cover": ""}];let games=DEFAULT_GAMES;let history=load("pa-public-history-v02",[]);let dirty=false;let publishedIds=new Set();function saveHistory(){try{localStorage.setItem("pa-public-history-v02",JSON.stringify(history))}catch{}}function adminAction(){}const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function copy(x){return JSON.parse(JSON.stringify(x))}
function load(k,f){try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:copy(f)}catch{return copy(f)}}
function toast(t){let root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>root.innerHTML='',3300)}
function validGame(g){return g && typeof g.id==='string' && typeof g.title==='string' && typeof g.url==='string' && (!g.url || !!safeUrl(g.url))}
function normalize(g){return {id:String(g.id),title:String(g.title),genre:String(g.genre||''),version:String(g.version||''),description:String(g.description||''),emoji:String(g.emoji||'🎮'),color:/^#[a-f\d]{6}$/i.test(g.color)?g.color:'#414f84',url:safeUrl(g.url)||'',cover:safeUrl(g.cover)||''}}
function download(name,content,type='text/html'){const u=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
let page='library',query='';
function getGame(id){return games.find(g=>g.id===id)}
function nav(){const options=[['library','▦','라이브러리'],['recent','◷','최근 실행'],['settings','⚙','정보']];const h=options.map(([id,ico,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${ico}</span>${label}</button>`).join('');$('#sideNav').innerHTML=h;$('#mobileNav').innerHTML=h}
function cover(g){return `<div class="cover" style="--ca:${esc(g.color||'#323d60')}">${g.cover?`<img alt="" src="${esc(g.cover)}" onerror="this.remove()">`:''}<span class="cover-symbol">${esc(g.emoji||'🎮')}</span><span class="chip">${esc(g.genre||'게임')}</span></div>`}
function card(g){return `<article class="game">${cover(g)}<div class="game-body"><div class="statusline"><h3>${esc(g.title)}</h3>${ADMIN?`<span class="pill ${publishedIds.has(g.id)?'live':''}">${publishedIds.has(g.id)?'공개됨':'미공개'}</span>`:''}</div><div class="meta">${esc(g.version||'웹게임')}</div><p class="desc">${esc(g.description||'설명이 없습니다.')}</p><div class="game-actions"><button class="btn primary" data-action="play" data-id="${esc(g.id)}">▶ 플레이</button><button class="btn" data-action="detail" data-id="${esc(g.id)}">상세</button></div>${ADMIN?`<div class="admin-actions"><button class="btn" data-action="edit" data-id="${esc(g.id)}">✎ 수정</button><button class="btn danger" data-action="remove" data-id="${esc(g.id)}">삭제</button></div>`:''}</div></article>`}
function renderCards(){let filtered=games.filter(g=>(g.title+' '+g.genre+' '+g.description).toLowerCase().includes(query.trim().toLowerCase()));$('#cards').innerHTML=filtered.map(card).join('')||`<div class="empty"><strong>표시할 게임이 없어요</strong>${query?'다른 검색어로 찾아보세요.':'등록된 게임이 없습니다.'}</div>`}
function close(){ $('#modalRoot').innerHTML='';document.body.style.overflow=''}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-back" id="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;document.body.style.overflow='hidden';$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()});$('#modalRoot').querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
function detail(id){let g=getGame(id);if(!g)return;modal(`<div class="modal-head"><h2>${esc(g.title)}</h2><button class="x" data-close aria-label="닫기">×</button></div><div class="detail-art" style="background:linear-gradient(135deg,${esc(g.color)},#172240)">${g.cover?`<img src="${esc(g.cover)}" alt="">`:esc(g.emoji)}</div><div class="detail-tags"><span class="tag">${esc(g.genre||'게임')}</span><span class="tag">${esc(g.version||'웹게임')}</span></div><p class="detail-info">${esc(g.description)}</p><p class="muted" style="font-size:12px;overflow-wrap:anywhere">${esc(g.url||'게임 주소 없음')}</p><div class="modal-actions">${ADMIN?`<button class="btn" id="modalEdit">✎ 수정</button>`:''}<button class="btn primary" id="modalPlay">▶ 플레이 ↗</button></div>`);if(ADMIN)$('#modalEdit').onclick=()=>edit(id);$('#modalPlay').onclick=()=>play(id)}
function play(id){let g=getGame(id);if(!g)return;let url=safeUrl(g.url);if(!url){toast('실행 URL이 없습니다.');return}history.unshift({id,at:new Date().toISOString()});history=history.slice(0,200);saveHistory();close();render();window.open(url,'_blank','noopener,noreferrer');}
function render(){nav();$('#addBtn').hidden=!ADMIN;$('#launchBtn').hidden=!ADMIN;$('#pageTitle').textContent=page==='recent'?'최근 실행 기록':page==='settings'?(ADMIN?'관리자 설정':'런처 정보'):'게임 라이브러리';$('#eyebrow').textContent=ADMIN?'ADMIN · PRIVATE WORKSPACE':'THE GAME COLLECTION';
if(page==='library'){let last=history.find(h=>!!getGame(h.id)),lastName=getGame(last?.id)?.title||'없음';$('#content').innerHTML=`${ADMIN?`<div class="publish-banner"><div><strong>🚀 런치 전에는 다른 사용자에게 변경사항이 보이지 않습니다.</strong><small>편집 내용을 저장한 뒤 상단의 <b>런치</b>를 누르면 배포용 index.html을 내려받습니다.<br>다운로드한 파일을 공개 GitHub Pages 사이트에 업로드해야 실제 이용자에게 표시됩니다.</small></div><span class="pill ${dirty?'':'live'}">${dirty?'미출시 변경사항':'마지막 런치 이후 변경 없음'}</span></div>`:''}<div class="stats"><div class="stat"><small>${ADMIN?'등록한 게임':'공개 게임'}</small><strong>${games.length}</strong></div><div class="stat"><small>이 브라우저의 실행 횟수</small><strong>${history.length}</strong></div><div class="stat"><small>최근 플레이</small><strong style="font-size:18px;overflow-wrap:anywhere">${esc(lastName)}</strong></div></div><div class="section-head"><h2>모든 게임</h2><input class="search" id="search" value="${esc(query)}" placeholder="⌕ 게임 검색" aria-label="게임 검색"></div><div id="cards" class="cards"></div><div class="page-foot">${ADMIN?'관리자 전용 파일 · 게임 목록을 수정할 수 있습니다.':'PROJECT ARCADE · 게임 목록은 관리자 런치로 공개됩니다.'}</div>`;renderCards();$('#search').addEventListener('input',e=>{query=e.target.value;renderCards()})}
else if(page==='recent'){let rows=history.map(h=>{let g=getGame(h.id);return g?`<div class="recent-item"><div><strong>${esc(g.emoji)} ${esc(g.title)}</strong><small>${esc(new Date(h.at).toLocaleString('ko-KR'))}</small></div><button class="btn" data-action="play" data-id="${esc(g.id)}">다시 플레이 ↗</button></div>`:''}).join('');$('#content').innerHTML=`<div class="section-head"><h2>실행 내역</h2><button class="btn ghost danger" data-action="clearHistory">기록 삭제</button></div><div class="recent">${rows||'<div class="empty"><strong>실행 기록이 없습니다.</strong>게임을 실행해 보세요.</div>'}</div>`}
else{$('#content').innerHTML=ADMIN?`<div class="settings-box"><h3>🚀 런치 및 공개</h3><p>런치 버튼으로 최신 등록 게임 목록만 포함한 일반 사용자용 <b>index.html</b>을 생성합니다. 이 파일을 GitHub Pages 저장소의 index.html에 업로드하고 변경사항을 커밋해야 외부 사용자에게 배포됩니다.</p><button class="btn primary" data-action="launch">🚀 런치 · 공개 파일 생성</button> <button class="btn" data-action="preview">공개 상태 미리보기</button></div><div class="settings-box"><h3>관리자 데이터 백업</h3><p>작업 중인 게임 목록을 JSON 파일로 백업하거나 복원합니다.</p><button class="btn" data-action="export">↓ 백업</button> <button class="btn" data-action="import">↑ 복원</button></div><div class="settings-box"><h3>기본 등록 게임 복원</h3><p>잔존도시, 외계어부, 라떼마을의 초기 정보를 복원합니다. 아직 공개되지 않은 상태로 바뀝니다.</p><button class="btn danger" data-action="reset">초기 3종 복원</button></div><div class="settings-box"><h3>관리자 접근 안내</h3><p>이 버전에는 비밀번호/서버 인증 기능이 없습니다. <b>admin.html을 공개 사이트에 올리지 말고 본인 컴퓨터에만 보관</b>하세요. 일반 사용자는 index.html만 사용합니다.</p></div>`:`<div class="settings-box"><h3>PROJECT ARCADE</h3><p>독립적으로 제작된 웹게임을 한곳에 모은 게임 라이브러리입니다. 게임은 새 탭에서 실행됩니다.</p></div><div class="settings-box"><h3>이용 기록</h3><p>최근 실행 내역은 사용 중인 브라우저에만 저장됩니다. 별도의 계정이나 공유 저장소를 사용하지 않습니다.</p></div>`}}
